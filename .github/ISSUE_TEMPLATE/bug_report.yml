name: Bug report
description: Report a reproducible problem without private data.
body:
  - type: markdown
    attributes:
      value: Do not include credentials, personal transcripts or recordings. Report security vulnerabilities privately using the Security tab.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use synthetic examples only.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, API or CLI provider, simulator or glasses; no account details.
